name: Update World IPTV Playlists

on:
  workflow_dispatch:

  schedule:
    - cron: "20 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build worldwide IPTV playlists
        run: python scripts/build_playlists.py

      - name: Check for playlist changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- playlist.m3u bangladesh.m3u india.m3u pakistan.m3u asia.m3u; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No playlist content changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Playlist content changed."
          fi

      - name: Commit updated playlists
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u
          git add bangladesh.m3u
          git add india.m3u
          git add pakistan.m3u
          git add asia.m3u
          git add reports/world-playlist-report.json

          git commit -m "Update worldwide IPTV playlists"
          git push
